name: Flutter Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Setup Flutter
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter doctor -v
      
      - name: Build Linux
        run: flutter build linux --release
      
      - name: Create Linux archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czf $GITHUB_WORKSPACE/linux-app.tar.gz *
      
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-app.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Setup Flutter
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter doctor -v
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create Windows archive
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-app.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-app.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Setup Flutter
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter doctor -v
      
      - name: Build macOS
        run: flutter build macos --release
      
      - name: Create macOS archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r $GITHUB_WORKSPACE/macos-app.zip *.app
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: macos-app.zip
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/linux-release
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows-release
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos-release
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-release/linux-app.tar.gz
            artifacts/windows-release/windows-app.zip
            artifacts/macos-release/macos-app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
